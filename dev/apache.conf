ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "/var/www/html/(dev|install|tests|tools|docs|migrations|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)(^\.|\.(sql|md|yml|yaml|ini|txt|sh|env|bak|log)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
<Directory /var/www/html/data>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|html?|inc|cgi|pl)$">
        Require all denied
    </FilesMatch>
</Directory>
