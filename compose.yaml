name: yourday-shop
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run python3 dev/configure.py first}
      MARIADB_DATABASE: yourday
      MARIADB_USER: yourday
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run python3 dev/configure.py first}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - database:/var/lib/mysql
      - ./dev/database.sh:/usr/local/bin/yourday-db:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
  web:
    build:
      context: .
      dockerfile: dev/Dockerfile
    ports:
      - "127.0.0.1:${SHOP_PORT:-8080}:${SHOP_PORT:-8080}"
    environment:
      SHOP_PORT: ${SHOP_PORT:-8080}
      DB_HOST: db
      DB_NAME: yourday
      DB_USER: yourday
      DB_PASSWORD: ${DB_PASSWORD}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
